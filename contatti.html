    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"

      rel="stylesheet"
    />

  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg sticky-top site-nav"
      aria-label="Navigazione principale"
    >
      <div class="container">
        <a class="navbar-brand brand" href="index.html"
          ><span>AS</span> </a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
          aria-label="Apri menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#progetti">Progetti</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="cv.html">CV</a></li>
            <li class="nav-item">
              <a class="btn btn-sm btn-accent px-3 active" href="contatti.html"
                >Contattami <span>↗</span></a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container section-pad contact-page">
      <div class="row g-5">
        <div class="col-lg-5">
          <p class="eyebrow">03 / Contatti</p>
          <h1>Hai un'idea?<br /><em>Parliamone.</em></h1>
          <p class="hero-copy mt-4">
            Compila il form e ti risponderò il prima possibile. Nessuna
            newsletter, solo una conversazione.
          </p>
          <div class="contact-detail mt-5">
            <span>✦</span>
            <div>
              <strong>Preferisci i social?</strong>
              <p>
                <a
                  href="https://www.linkedin.com/"
                  target="_blank"
                  rel="noreferrer"
                  >Scrivimi su LinkedIn ↗</a
                >
              </p>
            </div>
          </div>
        </div>
        <div class="col-lg-6 ms-lg-auto">
          <form class="contact-form" action="#" method="post">
            <div class="mb-4">
              <label for="name">Il tuo nome <span>*</span></label
              ><input
                id="name"
                name="name"
                type="text"
                required
                autocomplete="name"
                placeholder="Come ti chiami?"
              />
            </div>
            <div class="mb-4">
              <label for="email">La tua email <span>*</span></label
              ><input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
                placeholder="nome@azienda.it"
              />
            </div>
            <div class="mb-4">
              <label for="message">Il tuo messaggio <span>*</span></label
              ><textarea
                id="message"
                name="message"
                rows="5"
                required
                placeholder="Raccontami il tuo progetto..."
              ></textarea>
            </div>
            <div class="form-check mb-4">
              <input
                class="form-check-input"
                id="privacy"
                type="checkbox"
                required
              /><label class="form-check-label" for="privacy"
                >Accetto il trattamento dei dati per essere ricontattato.</label
              >
            </div>
            <button class="btn btn-accent btn-lg w-100" type="submit">
              Invia messaggio <span>↗</span>
            </button>
          </form>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="container d-flex justify-content-between">
        <span>© <span data-current-year></span> Andrea Squillace</span
        ><span>Grazie per essere passato.</span>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/site.js"></script>
  </body>
</html>
